<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HH System Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;

      /* ✅ LOCAL BACKGROUND IMAGE */
      background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("medicine.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .login-card {
      width: 420px;
      border-radius: 12px;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-eye {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      user-select: none;
    }
  </style>
</head>
  <form action="../backend/login_action.php" method="POST">
      <body class="d-flex justify-content-center align-items-center">

      <div class="card login-card p-4 shadow-lg">

        <!-- Welcome text -->
        <div class="text-center mb-4">
          <h6 class="text-muted">Welcome back!</h6>
          <h4 class="fw-bold">HH System Login</h4>
        </div>

        <!-- Username -->
        <div class="mb-3">
          <input type="text" name="user_id" class="form-control" placeholder="Username or Email (pharm_raj)" required>
        </div>

        <!-- Password -->
        <div class="mb-2 password-wrapper">
          <input type="password" name="password" id="password" class="form-control pe-5" placeholder="Password: pass123">
          <span class="toggle-eye" id="toggleEye">👁</span>
        </div>

        <!-- Login -->
        <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
  </form>

        <!-- Register -->
        <p class="text-center mb-0">
          No account? <a href="register.html">Register</a>
        </p>
      </div>
  

<script>
const password = document.getElementById("password");
const toggleEye = document.getElementById("toggleEye");

toggleEye.addEventListener("click", () => {
  if (password.type === "password") {
    password.type = "text";
    toggleEye.textContent = "🙈";
  } else {
    password.type = "password";
    toggleEye.textContent = "👁";
  }
});
</script>

</body>
</html>
