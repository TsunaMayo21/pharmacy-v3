<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HH System Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;

      /* ✅ LOCAL BACKGROUND IMAGE */
      background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("medicine.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .register-card {
      width: 460px;
      border-radius: 12px;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-eye {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      user-select: none;
    }

    .strength-bar {
      height: 6px;
      border-radius: 4px;
      margin-top: 6px;
      background-color: #e5e7eb;
      overflow: hidden;
    }

    .strength-bar div {
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    .weak { background-color: #dc2626; width: 33%; }
    .medium { background-color: #f59e0b; width: 66%; }
    .strong { background-color: #16a34a; width: 100%; }

    .strength-text {
      font-size: 0.85rem;
      margin-top: 4px;
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card register-card p-4 shadow-lg">

  <!-- ✅ WELCOME MESSAGE -->
  <div class="text-center mb-4">
    <h6 class="text-muted">Welcome!</h6>
    <h4 class="fw-bold">HH System Registration</h4>
  </div>

  <!-- Full Name -->
  <form action="../backend/register_action.php" method="POST">
        <div class="mb-3">
          <input type="text" name="name" class="form-control" placeholder="Full Name" required>
        </div>

        <div class="mb-3">
          <input type="email" name="email" class="form-control" placeholder="Email" required>
        </div>

        <div class="mb-3">
          <input type="text" name="username" class="form-control" placeholder="Username" required>
        </div>

        <!-- Password -->
        <div class="password-wrapper">
          <input type="password" name="password" id="password" class="form-control pe-5" placeholder="Password" required>
          <span class="toggle-eye" id="togglePassword">👁</span>
        </div>
        <div class="strength-bar">
          <div id="passwordStrength"></div>
        </div>
        <div class="strength-text" id="passwordText"></div>

        <!-- Confirm Password -->
        <div class="mt-3 password-wrapper">
          <input type="password" name="comfirm_password" id="confirm_password" class="form-control pe-5" placeholder="Confirm Password" required>
          <span class="toggle-eye" id="toggleConfirm">👁</span>
        </div>
        <div class="strength-bar">
          <div id="confirmStrength"></div>
        </div>
        <div class="strength-text" id="confirmText"></div>

        <!-- Register -->
        <button class="btn btn-primary w-100 mt-4 mb-3">
        Register
      </button>
  </form>


  <!-- Back -->
  <p class="text-center mb-0">
    <a href="login.html">Back to Login</a>
  </p>
</div>

<script>
/* Toggle visibility */
function toggleVisibility(inputId, toggleId) {
  const input = document.getElementById(inputId);
  const toggle = document.getElementById(toggleId);

  toggle.addEventListener("click", () => {
    if (input.type === "password") {
      input.type = "text";
      toggle.textContent = "🙈";
    } else {
      input.type = "password";
      toggle.textContent = "👁";
    }
  });
}

toggleVisibility("password", "togglePassword");
toggleVisibility("confirmPassword", "toggleConfirm");

/* Strength checker */
function checkStrength(input, bar, text) {
  input.addEventListener("input", () => {
    const value = input.value;
    let score = 0;

    if (value.length >= 6) score++;
    if (/[A-Z]/.test(value)) score++;
    if (/[0-9]/.test(value)) score++;
    if (/[^A-Za-z0-9]/.test(value)) score++;

    bar.className = "";

    if (value.length === 0) {
      bar.style.width = "0%";
      text.textContent = "";
    } else if (score <= 1) {
      bar.classList.add("weak");
      text.textContent = "Weak password";
      text.style.color = "#dc2626";
    } else if (score <= 3) {
      bar.classList.add("medium");
      text.textContent = "Medium strength password";
      text.style.color = "#f59e0b";
    } else {
      bar.classList.add("strong");
      text.textContent = "Strong password";
      text.style.color = "#16a34a";
    }
  });
}

checkStrength(
  document.getElementById("password"),
  document.getElementById("passwordStrength"),
  document.getElementById("passwordText")
);

checkStrength(
  document.getElementById("confirmPassword"),
  document.getElementById("confirmStrength"),
  document.getElementById("confirmText")
);
</script>

</body>
</html>
