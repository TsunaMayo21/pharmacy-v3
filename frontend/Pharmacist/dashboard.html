<script>
document.querySelectorAll(".dropdown-btn").forEach(btn => {
  btn.onclick = () => {
    const menu = btn.nextElementSibling;
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  };
});
//fetch data from database
document.addEventListener("DOMContentLoaded", function() {
    fetch('../../backend/Pharmacist/get_count.php')
        .then(res => res.json())
        .then(data => {
            // Log this to your browser console to verify the data is arriving
            console.log("Data received:", data); 

            // Update the HTML using the keys from your JSON
            document.getElementById('totalProducts').textContent = data.totalProducts;
            document.getElementById('expiringSoon').textContent  = data.expiringSoon;
            document.getElementById('expiredItems').textContent   = data.expiredItems;
            document.getElementById('pendingUsers').textContent   = data.pendingUsers;
        })
        .catch(err => {
            console.error("Dashboard error:", err);
        });
});
</script>
</script>

<script>
  // get current file name only
  const currentPage = window.location.pathname.split("/").pop();

  // remove ALL active classes (important)
  document.querySelectorAll(".sidebar .active").forEach(el => {
    el.classList.remove("active");
  });

  // find exact matching link
  document.querySelectorAll(".sidebar a.nav-link").forEach(link => {
    const linkPage = link.getAttribute("href");

    if (linkPage === currentPage) {
      link.classList.add("active");

      // open its dropdown if exists
      const dropdown = link.closest(".dropdown-container");
      if (dropdown) {
        dropdown.style.display = "block";
      }
    }
  });
</script>
