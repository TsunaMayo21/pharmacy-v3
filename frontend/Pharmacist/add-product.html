<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">

  <style>
    .form-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 48px;
      max-width: 900px;
      width: 100%;
      min-height: 560px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .steps {
      display: flex;
      gap: 8px;
    }

    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e5e7eb;
    }

    .step-dot.active {
      background: #2563eb;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .input-group .btn,
    .input-group .form-control {
      height: 48px;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h3>HH IMS</h3>

  <a href="dashboard.html" class="nav-link">Dashboard</a>

  <button class="dropdown-btn">Account ▾</button>
  <div class="dropdown-container">
    <a href="account-profile.html" class="nav-link">My Profile</a>
  </div>

  <button class="dropdown-btn">Products ▾</button>
  <div class="dropdown-container">
    <a href="add-product.html" class="nav-link active">Add Product</a>
    <a href="product-list.php" class="nav-link">Product List</a>
  </div>

  <button class="dropdown-btn">Reports ▾</button>
  <div class="dropdown-container">
    <a href="report-view.html" class="nav-link">View Report</a>
  </div>

  <a href="../../backend/logout.php" class="btn btn-danger mt-3">Logout</a>
</div>
<div class="content d-flex justify-content-center align-items-start pt-5">
  <div class="form-card">

    <form id="productForm"
          action="../../backend/Pharmacist/add_product_action.php"
          method="POST"
          onsubmit="return validateForm();">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Add New Product</h3>
        <div class="steps">
          <div class="step-dot active" id="dot1"></div>
          <div class="step-dot" id="dot2"></div>
          <div class="step-dot" id="dot3"></div>
        </div>
      </div>

      <div class="step active" id="step1">
        <h5 class="fw-semibold mb-3">Step 1: Product Information</h5>

        <div class="mb-3">
          <label class="form-label">Product Name</label>
          <input type="text" name="productName" class="form-control" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Brand Name</label>
          <input type="text" name="brandName" class="form-control">
        </div>

        <div class="text-end">
          <button type="button" class="btn btn-primary" onclick="nextStep(2)">
            Next <i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </div>

      <div class="step" id="step2">
        <h5 class="fw-semibold mb-3">Step 2: Batch Details</h5>

        <div class="mb-3">
          <label class="form-label">Batch Number</label>
          <input type="text" name="batchNumber" class="form-control" required>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label">Quantity</label>
            <input
              type="number"
              name="quantity"
              class="form-control"
              value="0"
              min="0"
              step="1"
              onkeypress="return (event.charCode >= 48 && event.charCode <= 57)"
              onpaste="return false"
              oninput="if(this.value < 0) this.value = 0;"
              required
            >
          </div>

          <div class="col-md-6">
            <label class="form-label">Expiry Date</label>
            <input
              type="date"
              name="expiryDate"
              class="form-control"
              id="expiryDate"
              onkeydown="return false" 
              onclick="this.min = new Date().toISOString().split('T')[0]"
              required
            >
          </div>
        </div>

        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-outline-secondary" onclick="prevStep(1)">Previous</button>
          <button type="button" class="btn btn-primary" onclick="nextStep(3)">
            Next <i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </div>

      <div class="step" id="step3">
        <h5 class="fw-semibold mb-3">Step 3: Supplier</h5>

        <div class="mb-3 position-relative">
          <label class="form-label">Supplier Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" name="supplierName" id="supplierSearch"
                   class="form-control" autocomplete="off" required>
          </div>
          <div id="supplierResults"
               class="list-group position-absolute w-100 shadow-sm"
               style="z-index:1000;"></div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label">Supplier Email</label>
            <input type="email" name="supplierEmail" id="supEmail" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">PIC Name</label>
            <input type="text" name="picName" id="picName" class="form-control">
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label">PIC Phone Number</label>
            <input type="text" name="picPhoneNum" id="picPhone" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">PIC Email</label>
            <input type="email" name="picEmail" id="picEmail" class="form-control">
          </div>
        </div>

        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-outline-secondary" onclick="prevStep(2)">Previous</button>
          <button type="submit" class="btn btn-success">Save Product</button>
        </div>
      </div>

    </form>
  </div>
</div>

<script>
function nextStep(step) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + step).classList.add('active');

  document.querySelectorAll('.step-dot').forEach(d => d.classList.remove('active'));
  document.getElementById('dot' + step).classList.add('active');
}

function prevStep(step) {
  nextStep(step);
}
</script>

<script>
  // Initial safety check on load
  document.addEventListener('DOMContentLoaded', function() {
      const today = new Date().toISOString().split("T")[0];
      const expiryInput = document.getElementById("expiryDate");
      if(expiryInput) {
          expiryInput.setAttribute("min", today);
      }
  });

  function validateForm() {
    const qty = document.querySelector('input[name="quantity"]').value;
    const expiry = document.getElementById("expiryDate").value;
    const today = new Date().toISOString().split("T")[0];

    // Double check on submit just in case
    if (qty < 0) {
      alert("Quantity cannot be less than 0.");
      return false;
    }

    if (expiry < today) {
      alert("Expiry date cannot be in the past.");
      return false;
    }

    return true;
  }
</script>

<script>
document.querySelectorAll(".dropdown-btn").forEach(btn => {
  btn.onclick = () => {
    const menu = btn.nextElementSibling;
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  };
});
</script>


<script>
  // get current file name only
  const currentPage = window.location.pathname.split("/").pop();

  // remove ALL active classes (important)
  document.querySelectorAll(".sidebar .active").forEach(el => {
    el.classList.remove("active");
  });

  // find exact matching link
  document.querySelectorAll(".sidebar a.nav-link").forEach(link => {
    const linkPage = link.getAttribute("href");

    if (linkPage === currentPage) {
      link.classList.add("active");

      // open its dropdown if exists
      const dropdown = link.closest(".dropdown-container");
      if (dropdown) {
        dropdown.style.display = "block";
      }
    }
  });

  //search supplier
const supplierInput = document.getElementById('supplierSearch');
const resultsDiv = document.getElementById('supplierResults');
supplierInput.addEventListener('input', function() {
    const query = this.value;
    if (query.length < 2) {
        resultsDiv.innerHTML = '';
        return;
    }

    fetch(`../../backend/Pharmacist/search_supplier.php?q=${query}`)
        .then(response => response.json())
        .then(data => {
            resultsDiv.innerHTML = '';
            data.forEach(supplier => {
                const item = document.createElement('a');
                item.classList.add('list-group-item', 'list-group-item-action');
                item.textContent = supplier.supplierName;
                item.onclick = () => {
                    // 1. Fill the Supplier Name
                    supplierInput.value = supplier.supplierName;

                    // 2. Fill the Supplier Email (Match id="supEmail")
                    document.getElementById('supEmail').value = supplier.supplierEmail;

                    // 3. Fill the PIC Name (Match id="picName")
                    document.getElementById('picName').value = supplier.picName;

                    // 4. FIX: Use 'picPhone' instead of 'supContact'
                    document.getElementById('picPhone').value = supplier.picPhoneNum;

                    // 5. Fill the PIC Email (Match id="picEmail")
                    document.getElementById('picEmail').value = supplier.picEmail;

                    // Clear the dropdown results
                    resultsDiv.innerHTML = '';
                };
                resultsDiv.appendChild(item);
            });
        });
});
</script>

</body>
</html>
