<div class="content d-flex justify-content-center pt-4">

        <div class="row mb-4">
          <div class="col-md-6">
            <div class="label-title">Full Name</div>

          <div class="col-md-6">

          </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <div class="label-title">Email</div>
            <input type="email" name="email" id="email" class="form-control" required>
          </div>

          <div class="col-md-6">
            <div class="label-title">Phone Number</div>
            <input type="text" name="phoneNum" id="phoneNum" class="form-control" placeholder="e.g. 0123456789">
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <div class="label-title">Password (Leave blank to keep current)</div>
            <div class="input-group">
              <input type="password" name="password" id="password" class="form-control" placeholder="New password" oninput="checkStrength()">
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                <i class="bi bi-eye" id="eyeIcon"></i>
              </button>
            </div>
            <div id="strengthText" class="strength-text"></div>
          </div>

          <div class="col-md-6">

          </div>

          <div class="label-title">Account Status</div>
          <span class="status-badge" id="statusBadge">
             </span>

        </div>

<script>
function togglePassword() {
  const pwd = document.getElementById("password");
  const eye = document.getElementById("eyeIcon");

  if (pwd.type === "password") {
    pwd.type = "text";
    eye.className = "bi bi-eye-slash";
  } else {
    pwd.type = "password";
    eye.className = "bi bi-eye";
  }
}

function checkStrength() {
  const pwd = document.getElementById("password").value;
  const strengthText = document.getElementById("strengthText");

  if (pwd.length === 0) {
    strengthText.textContent = "";
    return;
  }

  if (pwd.length < 6) {
    strengthText.textContent = "Weak password";
    strengthText.className = "strength-text strength-weak";
  } else if (pwd.match(/[A-Z]/) && pwd.match(/[0-9]/)) {
    strengthText.textContent = "Strong password";
    strengthText.className = "strength-text strength-strong";
  } else {
    strengthText.textContent = "Medium password";
    strengthText.className = "strength-text strength-medium";
  }
}

document.querySelectorAll(".dropdown-btn").forEach(btn => {
  btn.onclick = () => {
    const menu = btn.nextElementSibling;
    menu.style.display =
      menu.style.display === "block" ? "none" : "block";
  };
});

//fetch data from database
document.addEventListener("DOMContentLoaded", function() {
    fetch('../../backend/Pharmacist/get_profile.php')
        .then(response => response.json())
        .then(data => {
            if(!data.error) {
                // FIXED: Removing 'profile' prefix to match your HTML IDs
                document.getElementById('name').value = data.name || "";
                document.getElementById('username').value = data.username || "";
                document.getElementById('email').value = data.email || "";
                document.getElementById('phoneNum').value = data.phoneNum || "";
                document.getElementById('profileRole').value = data.role || "";

                // Update the avatar letter and status badge
                document.getElementById('profileAvatar').textContent = data.name.charAt(0).toUpperCase();
                document.getElementById('statusBadge').innerHTML = `<span class="status-dot"></span> ${data.accountStatus}`;
            }
        })
        .catch(err => console.error("Fetch error:", err));
});

function updateProfile(event) {
    // Prevent immediate submit to show confirmation
    event.preventDefault();
    
    if (confirm("Are you sure you want to update your profile?")) {
        // This targets the form element and submits it to your PHP action
        event.currentTarget.submit();
    }
}
</script>

<script>
  // get current file name only
  const currentPage = window.location.pathname.split("/").pop();

  // remove ALL active classes (important)
  document.querySelectorAll(".sidebar .active").forEach(el => {
    el.classList.remove("active");
  });

  // find exact matching link
  document.querySelectorAll(".sidebar a.nav-link").forEach(link => {
    const linkPage = link.getAttribute("href");

    if (linkPage === currentPage) {
      link.classList.add("active");

      // open its dropdown if exists
      const dropdown = link.closest(".dropdown-container");
      if (dropdown) {
        dropdown.style.display = "block";
      }
    }
  });
</script>
